<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="pagina">
    <h1>Pokédex</h1>
    <p class="subtitulo">A biblioteca à palma da tua mão</p>

    <form id="form-tipo" class="pesquisa">
      <label for="pesquisa">Escreve o nome ou um elemento</label>
      <div class="linha-pesquisa">
        <input id="pesquisa" name="pesquisa" type="text" placeholder="Ex.: pikachu ou fire" required>
        <button type="submit">Pesquisar</button>
      </div>
    </form>

    <p id="mensagem" class="mensagem" aria-live="polite">
    </p>
    <ul id="lista-pokemon" class="lista-pokemon"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
