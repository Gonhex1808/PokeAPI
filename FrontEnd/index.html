<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex por tipo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="pagina">
    <h1>Pokédex</h1>
    <p class="subtitulo">Procura Pokémon pelo seu tipo.</p>

    <form id="form-tipo" class="pesquisa">
      <label for="tipo">Tipo de Pokémon</label>
      <div class="linha-pesquisa">
        <input id="tipo" name="tipo" type="text" placeholder="Ex.: fire" required>
        <button type="submit">Pesquisar</button>
      </div>
    </form>

    <p id="mensagem" class="mensagem" aria-live="polite">
      Escreve um tipo para ver os Pokémon.
    </p>
    <ul id="lista-pokemon" class="lista-pokemon"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
